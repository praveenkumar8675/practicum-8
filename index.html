<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Information</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      text-align: center;
      padding: 20px;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .info-box {
      background: white;
      border: 2px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      width: 200px;
    }
    .info-box img {
      width: 80px;
      border-radius: 50%;
    }
    @media (max-width: 650px) {
      .container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <h2>Student Directory</h2>
  <div class="container">
    <div class="info-box">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Ananya" alt="Student 1">
      <h3>RAJ</h3>
      <p>ID: STU-101 | Grade: A</p>
    </div>
    <div class="info-box">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Karthik" alt="Student 2">
      <h3>SAM</h3>
      <p>ID: STU-102 | Grade: A+</p>
    </div>
    <div class="info-box">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Meera" alt="Student 3">
      <h3>GOKU</h3>
      <p>ID: STU-103 | Grade: B+</p>
    </div>
  </div>

</body>
</html>
